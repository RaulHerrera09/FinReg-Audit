services:
  postgres:
    image: postgres:16-alpine
    container_name: finreg_postgres
    environment:
      POSTGRES_DB: finreg
      POSTGRES_USER: finreg
      POSTGRES_PASSWORD: finreg_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finreg -d finreg"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
